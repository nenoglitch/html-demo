<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 技巧选择器选中标签的范围越大,优先级/权重越低 */
        div {
            color: green;
        }
            /* color: red !important; 提权功能,提高权重/优先级 最高,慎用*/
        * {
            color: red;
        }
        .box {
            color: blue;
        }
        #test {
            color: yellow;
        }
    </style>
</head>
<body>
   <div class="box" id="test" style="color: purple;">div标签</div> 
</body>
</html>
