<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 300px;
            height: 200px;
            background-color: pink;

            background-image: url(./tupian.jpg);
            background-repeat: no-repeat;
            /* contain:如果图的宽高与盒子尺寸相等停止缩放，可能导致盒子有露白 */
            /* background-size: contain; */

            /* cover图片完全覆盖盒子可能导致图片不全 */
           /* background-size: cover; */

           /* 100%表示图片的宽度和盒子一样高度按照片等比例缩放 */
           background-size: 100%;
        }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
