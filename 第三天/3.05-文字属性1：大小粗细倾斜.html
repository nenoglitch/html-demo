<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            /* font-size属性必须有单位否则属性不生效 */
            font-size: 30px;
        }
        h3 {
            font-weight: 400;
        }
        div {
         
            font-weight: 700;
        }
        em {
            font-style: normal;
        }
       h5 {
        font-style: italic;
       } 
    </style>
</head>
<body>
    <p>测试字体大小</p>
    <p>测试字体大小</p>
    <h3>h3标签</h3>
    <div>div标签</div>
    <em>em标签</em>
    <h5>h5标签</h5>
</body>
</html>
