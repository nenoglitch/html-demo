<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
/* 特点：选中同名标签设置相同的样式，无法差异化同名标签的样式 */
    /* 定义:一个类选择器可以给多个标签使用 */
    .red{
        color: red;
    }

    .size{
        font-size: 30px;
    }
    </style>
</head>
<body>
    <p class="red">这是p标签</p>
    <p>pppp</p>
    <!-- 一个标签库可以使用多个类选择器：class属性值多写个类名，类名用空格隔开 -->
    <div class="red size">这是div标签</div>
</body>
</html>
